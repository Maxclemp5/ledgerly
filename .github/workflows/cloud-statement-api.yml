name: Cloud Statement API CI
on:
  push:
    paths:
      - 'cloud-statement-api/**'
      - 'render.yaml'
      - '.github/workflows/cloud-statement-api.yml'
  pull_request:
    paths:
      - 'cloud-statement-api/**'
      - 'render.yaml'
      - '.github/workflows/cloud-statement-api.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-statement-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check src/handler.mjs
          node --check src/main.mjs
          node --check src/repository.mjs
          node --check src/staticServer.mjs
          node --check src/issuerLedger.mjs
      - name: API, ledger and database configuration tests
        run: npm test
      - name: Verify React dashboard build
        run: |
          cd dashboard
          npm install --no-audit --no-fund
          npm run build
      - name: Validate Render Blueprint
        run: ruby -e "require 'yaml'; YAML.load_file('../render.yaml')"
