name: Java Demo PDF Renderer
on:
  push:
    paths:
      - 'java-demo-pdf-renderer/**'
      - '.github/workflows/java-demo-pdf-renderer.yml'
  pull_request:
    paths:
      - 'java-demo-pdf-renderer/**'
      - '.github/workflows/java-demo-pdf-renderer.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-demo-pdf-renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: java-demo-pdf-renderer/pom.xml
      - name: Install licensed Inter resources
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-inter
          mkdir -p src/main/resources/fonts
          cp /usr/share/fonts/opentype/inter/Inter-*.otf src/main/resources/fonts/
          cp /usr/share/doc/fonts-inter/copyright src/main/resources/fonts/INTER-LICENSE.txt
      - name: Build
        run: mvn -B -ntp package
      - name: Test PDF generation
        run: java -jar target/renderer.jar --self-test
