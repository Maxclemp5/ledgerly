name: Verify OpenPDF Free Service Health
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-openpdf-free-health.yml'
jobs:
  test-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public OpenPDF health without credentials
        shell: bash
        run: |
          for attempt in $(seq 1 18); do
            code=$(curl -sS --connect-timeout 8 --max-time 10 -o /tmp/render-health.txt -w '%{http_code}' \
              https://ledgerdesk-openpdf-stamper-free.onrender.com/health || true)
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/render-health.txt; then
              echo 'OpenPDF health verified'; exit 0
            fi
            sleep 6
          done
          echo 'OpenPDF health unavailable after multiple attempts'
          exit 1

      - name: Probe Java from within Node Free network path
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl -sS --connect-timeout 8 --max-time 15 -o /tmp/node-pdf-health.txt -w '%{http_code}' \
              https://ledgerly-free-test-api.onrender.com/health/openpdf || true)
            echo "Node-to-Java attempt $attempt: HTTP $code"
            cat /tmp/node-pdf-health.txt || true
            echo
            if [ "$code" = "200" ] && grep -q '"upstream":"healthy"' /tmp/node-pdf-health.txt; then
              echo 'Node-to-Java network path verified'; exit 0
            fi
            sleep 8
          done
          echo 'Node-to-Java path unhealthy'; exit 1
